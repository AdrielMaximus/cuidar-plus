<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f7d6d">
<link rel="manifest" href="manifest.json">
<title>Cuidar+</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f7f6; color: #222; }
  header { background: #2f7d6d; color: #fff; padding: 14px 16px; font-size: 20px; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px #0002; }
  input, select, textarea, button { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #bbb; }
  button { background: #2f7d6d; color: #fff; border: none; cursor: pointer; }
  button.sec { background: #e3ecea; color: #1d4d43; }
  .linha { display: flex; gap: 8px; }
  .item { border-bottom: 1px solid #eee; padding: 8px 0; }
  .item small { color: #666; }
  .oculto { display: none; }
  #msg { color: #b00020; min-height: 20px; }
</style>
</head>
<body>
<header>Cuidar+</header>
<main>
  <p id="msg"></p>

  <!-- Login -->
  <section id="telaLogin" class="card oculto">
    <h3>Entrar</h3>
    <input id="email" type="email" placeholder="E-mail">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)">
    <input id="nomeUsuario" placeholder="Seu nome (só no primeiro cadastro)">
    <div class="linha">
      <button onclick="entrarConta()">Entrar</button>
      <button class="sec" onclick="criarConta()">Criar conta</button>
    </div>
  </section>

  <!-- Aplicativo -->
  <section id="telaApp" class="oculto">
    <div class="card">
      <label>Idoso atual</label>
      <select id="selIdoso" onchange="trocarIdoso()"></select>
      <div class="linha">
        <input id="codigoEntrar" placeholder="Código (ex.: MARIA78)">
        <button class="sec" onclick="entrarPorCodigo()">Entrar</button>
      </div>
      <div class="linha">
        <input id="nomeNovo" placeholder="Nome do novo idoso">
        <button class="sec" onclick="cadastrarIdoso()">Cadastrar</button>
      </div>
    </div>

    <div class="card" id="boxRegistro">
      <h3>Novo registro</h3>
      <select id="tipo">
        <option>Medicamento administrado</option>
        <option>Dor</option>
        <option>Alimentação</option>
        <option>Hidratação</option>
        <option>Sono</option>
        <option>Humor / Comportamento</option>
        <option>Queda</option>
        <option>Sintoma / Intercorrência</option>
        <option>Observação livre</option>
      </select>
      <textarea id="valor" rows="3" placeholder="Descreva (para Dor, use um número de 0 a 10)"></textarea>
      <button onclick="salvarRegistro()">Salvar registro</button>
    </div>

    <div class="card">
      <div class="linha">
        <button class="sec" onclick="verHoje()">Ver hoje</button>
        <button class="sec" onclick="resumo(7)">Resumo 7 dias</button>
        <button class="sec" onclick="resumo(14)">Resumo 14 dias</button>
      </div>
      <div id="lista"></div>
    </div>

    <button class="sec" onclick="sair()">Sair da conta</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://hyvpcaxwerfxgjpnqaxo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_e_EIPy-IqqwR_0-bLiA8pA_CkRM79xU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let usuario = null;
const $ = (id) => document.getElementById(id);
const aviso = (t) => { $("msg").textContent = t || ""; };
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&", "<": "<", ">": ">", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => new Date(iso).toLocaleString("pt-BR",
  { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

async function iniciar() {
  const { data } = await sb.auth.getSession();
  usuario = data.session?.user ?? null;
  $("telaLogin").classList.toggle("oculto", !!usuario);
  $("telaApp").classList.toggle("oculto", !usuario);
  if (usuario) await carregarIdosos();
}

async function criarConta() {
  aviso();
  const nome = $("nomeUsuario").value.trim();
  const { error } = await sb.auth.signUp({
    email: $("email").value.trim(),
    password: $("senha").value,
    options: { data: { nome } }
  });
  if (error) return aviso(error.message);
  aviso("Conta criada. Se pedir confirmação, verifique seu e-mail e depois clique em Entrar.");
  iniciar();
}

async function entrarConta() {
  aviso();
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("senha").value });
  if (error) return aviso("E-mail ou senha incorretos, ou e-mail ainda não confirmado.");
  iniciar();
}

async function sair() { await sb.auth.signOut(); iniciar(); }

function nomeDoUsuario() {
  return usuario.user_metadata?.nome || usuario.email;
}

async function carregarIdosos() {
  const { data, error } = await sb.from("vinculos_app")
    .select("codigo_idoso, idosos(nome)").order("joined_at", { ascending: false });
  if (error) return aviso("Não foi possível carregar seus idosos.");
  const sel = $("selIdoso");
  const atual = localStorage.getItem("idosoAtual");
  sel.innerHTML = "";
  data.forEach(v => {
    const o = document.createElement("option");
    o.value = v.codigo_idoso;
    o.textContent = `${v.idosos?.nome ?? "Idoso"} (${v.codigo_idoso})`;
    sel.appendChild(o);
  });
  if (atual && data.some(v => v.codigo_idoso === atual)) sel.value = atual;
  $("boxRegistro").classList.toggle("oculto", data.length === 0);
  if (data.length === 0) aviso("Entre com um código ou cadastre um idoso para começar.");
  trocarIdoso();
}

function trocarIdoso() {
  localStorage.setItem("idosoAtual", $("selIdoso").value);
  $("lista").innerHTML = "";
}

async function entrarPorCodigo() {
  aviso();
  const codigo = $("codigoEntrar").value.trim();
  if (!codigo) return aviso("Digite o código do idoso.");
  const { error } = await sb.rpc("entrar_idoso", { p_codigo: codigo });
  if (error) return aviso("Código não encontrado. Confira e tente novamente.");
  localStorage.setItem("idosoAtual", codigo.toUpperCase());
  $("codigoEntrar").value = "";
  carregarIdosos();
}

function gerarCodigo(nome) {
  const limpo = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toUpperCase().split(/\s+/)
    .map(p => p.replace(/[^A-Z]/g, ""))
    .find(p => p && !["DONA", "SEU", "SR", "SRA", "DR", "DRA"].includes(p)) || "IDOSO";
  return limpo.slice(0, 8) + Math.floor(10 + Math.random() * 90);
}

async function cadastrarIdoso() {
  aviso();
  const nome = $("nomeNovo").value.trim().replace(/\s+/g, " ");
  if (nome.length < 2 || nome.length > 60) return aviso("O nome deve ter entre 2 e 60 caracteres.");
  for (let i = 0; i < 10; i++) {
    const codigo = gerarCodigo(nome) + (i > 4 ? Math.floor(Math.random() * 100) : "");
    const { data, error } = await sb.rpc("criar_idoso", { p_codigo: codigo, p_nome: nome });
    if (!error) {
      localStorage.setItem("idosoAtual", data);
      $("nomeNovo").value = "";
      aviso(`Idoso cadastrado! Código para compartilhar: ${data}`);
      return carregarIdosos();
    }
  }
  aviso("Não foi possível gerar um código. Tente novamente.");
}

async function salvarRegistro() {
  aviso();
  const codigo = $("selIdoso").value;
  const tipo = $("tipo").value;
  const valor = $("valor").value.trim();
  if (!codigo) return aviso("Selecione um idoso.");
  if (!valor) return aviso("Digite a informação do registro.");
  if (tipo === "Dor") {
    const n = Number(valor);
    if (!Number.isInteger(n) || n < 0 || n > 10) return aviso("Para dor, informe um número inteiro de 0 a 10.");
  }
  const { error } = await sb.from("registros").insert({
    codigo_idoso: codigo, tipo, valor,
    auth_user_id: usuario.id, user_name: nomeDoUsuario()
  });
  if (error) return aviso("Não foi possível salvar o registro.");
  $("valor").value = "";
  aviso("Registro salvo com sucesso.");
  verHoje();
}

async function buscar(inicio) {
  const codigo = $("selIdoso").value;
  const { data, error } = await sb.from("registros").select("*")
    .eq("codigo_idoso", codigo).gte("created_at", inicio.toISOString())
    .order("created_at", { ascending: true });
  if (error) { aviso("Não foi possível consultar os registros."); return []; }
  return data;
}

async function verHoje() {
  const ini = new Date(); ini.setHours(0, 0, 0, 0);
  const regs = await buscar(ini);
  $("lista").innerHTML = "<h3>Registros de hoje</h3>" + (regs.length
    ? regs.map(r => `<div class="item"><b>${esc(r.tipo)}</b> — ${esc(r.valor)}<br>
        <small>${fmt(r.created_at)} · ${esc(r.user_name)}</small></div>`).join("")
    : "<p>Nenhum registro hoje.</p>");
}

async function resumo(dias) {
  const ini = new Date(Date.now() - dias * 86400000);
  const regs = await buscar(ini);
  if (!regs.length) { $("lista").innerHTML = `<p>Nenhum registro nos últimos ${dias} dias.</p>`; return; }
  const grupos = {};
  regs.forEach(r => (grupos[r.tipo] ||= []).push(r));
  $("lista").innerHTML = `<h3>Resumo dos últimos ${dias} dias</h3>` +
    Object.keys(grupos).sort().map(t => `<h4>${esc(t)}</h4>` +
      grupos[t].map(r => `<div class="item">${fmt(r.created_at)} — ${esc(r.valor)}
        <small>(${esc(r.user_name)})</small></div>`).join("")).join("");
}

iniciar();
</script>
</body>
</html>
